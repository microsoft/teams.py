# =============================================================================
# This pipeline publishes Python packages. Manually triggered only.
# - Internal: publishes unsigned packages to the internal TeamsSDKPreviews feed.
# - Public: publishes signed packages to PyPI via ESRP (requires approval).
# - promoteView: Internal only. Feed view to promote the published packages to
#   (for example Prerelease). Blank skips promotion. Promotion is one-way:
#   Azure Artifacts has no demotion, so a view can only be cleaned up by
#   deleting the package version or the view itself.
# =============================================================================

trigger: none

pr: none

parameters:
- name: publishType
  displayName: 'Publish Type'
  type: string
  default: 'Internal'
  values:
  - Internal
  - Public

- name: promoteView
  displayName: 'Promote to feed view (Internal only, blank to skip)'
  type: string
  default: ''

variables:
- group: TeamsSDK-Release
- name: internalFeedName
  value: 'TeamsSDKPreviews'
- name: ExcludePackageFolders
  value: ''  # Space-separated list of distribution name fragments to exclude (matched as microsoft_teams_<value>*)

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: 1ES-Teams-Windows-2022-DomoreexpGithub
      os: windows
    stages:
    - stage: build
      displayName: Build and Test
      jobs:
      - job: build_test
        pool:
          name: 1ES-Teams-Windows-2022-DomoreexpGithub
          os: windows
        templateContext:
          outputs:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/out
            artifactName: pypi-packages
        variables:
          ob_outputDirectory: '$(Build.SourcesDirectory)/out'
          ob_git_fetchTags: true
          ob_sdl_binskim_break: true
          ob_git_fetchDepth: -1
          NBGV_REQUIRED: '1'

        steps:
        - checkout: self
          displayName: 'Checkout'
          fetchDepth: 0
          target:
            container: host

        - task: UsePythonVersion@0
          displayName: 'Use Python 3.13'
          inputs:
            versionSpec: '3.13'
          target:
            container: host

        - task: UseDotNet@2
          displayName: 'Use .NET SDK'
          inputs:
            packageType: 'sdk'
            version: '8.x'
          target:
            container: host

        - task: NuGetAuthenticate@1
          displayName: 'Authenticate to Azure Artifacts'
          target:
            container: host

        - task: PowerShell@2
          displayName: 'Install uv, nbgv and set cloud build version'
          inputs:
            targetType: inline
            script: |
              $ErrorActionPreference = 'Stop'

              # Install uv
              irm https://astral.sh/uv/install.ps1 | iex
              $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
              [System.Environment]::SetEnvironmentVariable('Path', "$env:USERPROFILE\.local\bin;$([System.Environment]::GetEnvironmentVariable('Path', 'User'))", 'User')
              Write-Host "##vso[task.prependpath]$env:USERPROFILE\.local\bin"
              uv --version
              if ($LASTEXITCODE -ne 0) { throw "uv --version failed with exit code $LASTEXITCODE." }

              # Install nbgv
              $nugetConfig = "$(Agent.TempDirectory)\NuGet.TeamsSDKPreviews.config"
              @'
              <?xml version="1.0" encoding="utf-8"?>
              <configuration>
                <packageSources>
                  <clear />
                  <add key="TeamsSDKPreviews" value="https://pkgs.dev.azure.com/DomoreexpGithub/Github_Pipelines/_packaging/TeamsSDKPreviews/nuget/v3/index.json" />
                </packageSources>
              </configuration>
              '@ | Set-Content -Path $nugetConfig -Encoding UTF8

              dotnet nuget list source --configfile $nugetConfig
              if ($LASTEXITCODE -ne 0) { throw "dotnet nuget list source failed with exit code $LASTEXITCODE." }

              dotnet tool install -g nbgv --configfile $nugetConfig
              if ($LASTEXITCODE -ne 0) { throw "dotnet tool install failed with exit code $LASTEXITCODE." }

              $toolsPath = Join-Path $env:USERPROFILE ".dotnet\tools"
              $env:Path = "$toolsPath;$env:Path"
              Write-Host "##vso[task.prependpath]$env:USERPROFILE\.dotnet\tools"
              nbgv --version
              if ($LASTEXITCODE -ne 0) { throw "nbgv --version failed with exit code $LASTEXITCODE." }

              # Set cloud build number and variables (resolves detached HEAD in ADO)
              nbgv cloud
              if ($LASTEXITCODE -ne 0) { throw "nbgv cloud failed with exit code $LASTEXITCODE." }
          target:
            container: host

        - powershell: |
            Write-Host "Getting version from nbgv..."
            $version = (nbgv get-version -v SemVer2).Trim()
            Write-Host "Version from nbgv: $version"
            Write-Host "##vso[task.setvariable variable=VersionNumber;isOutput=true]$version"

            # If version contains '-' it's a prerelease, use 'next' tag; otherwise 'latest'
            if ($version -match '-') {
              Write-Host "Prerelease version detected - using 'next' PyPI tag"
              Write-Host "##vso[task.setvariable variable=PyPITag;isOutput=true]next"
            } else {
              Write-Host "Stable version detected - using 'latest' PyPI tag"
              Write-Host "##vso[task.setvariable variable=PyPITag;isOutput=true]latest"
            }
          displayName: 'Get version from nbgv'
          name: versionStep
          env:
            PublicRelease: 'true'
          target:
            container: host

        - task: PowerShell@2
          displayName: 'Install dependencies'
          inputs:
            targetType: inline
            script: |
              $pythonPath = (Get-Command python).Source
              Write-Host "Using Python at: $pythonPath"
              python --version
              # Always use internal feed for dependency resolution (avoids firewall issues on 1ES pool)
              $env:UV_INDEX_URL = "https://build:$($env:SYSTEM_ACCESSTOKEN)@pkgs.dev.azure.com/DomoreexpGithub/Github_Pipelines/_packaging/TeamsSDKPreviews/pypi/simple/"
              Write-Host "Using authenticated Azure Artifacts feed"
              uv venv --python $pythonPath
              $lockedRequirements = "$(Agent.TempDirectory)\publish-requirements.txt"
              uv export --quiet --frozen --all-packages --group dev --format requirements-txt --output-file $lockedRequirements
              uv pip sync --python .venv\Scripts\python.exe $lockedRequirements
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          target:
            container: host

        - task: PowerShell@2
          displayName: 'Run tests'
          inputs:
            targetType: inline
            script: |
              Write-Host "Running tests..."
              # Always use internal feed for dependency resolution (avoids firewall issues on 1ES pool)
              $env:UV_INDEX_URL = "https://build:$($env:SYSTEM_ACCESSTOKEN)@pkgs.dev.azure.com/DomoreexpGithub/Github_Pipelines/_packaging/TeamsSDKPreviews/pypi/simple/"
              .venv\Scripts\Activate.ps1
              pytest packages --junitxml=test-results.xml
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          continueOnError: false
          target:
            container: host

        - task: PublishTestResults@2
          displayName: 'Publish Test Results'
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: 'JUnit'
            testResultsFiles: '**/test-results.xml'
            mergeTestResults: true
          target:
            container: host

        - task: PowerShell@2
          displayName: 'Build packages'
          inputs:
            targetType: inline
            script: |
              $pythonPath = (Get-Command python).Source
              # Always use internal feed for build dependencies (avoids firewall issues on 1ES pool)
              $indexUrl = "https://build:$($env:SYSTEM_ACCESSTOKEN)@pkgs.dev.azure.com/DomoreexpGithub/Github_Pipelines/_packaging/TeamsSDKPreviews/pypi/simple/"
              $env:PIP_INDEX_URL = $indexUrl
              $env:UV_INDEX_URL = $indexUrl
              Write-Host "Using authenticated Azure Artifacts feed for build"
              Write-Host "Building wheels and source distributions (version determined by nbgv)..."
              uv build --all-packages --wheel --python $pythonPath
              uv build --all-packages --sdist --python $pythonPath
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          target:
            container: host

        - powershell: |
            New-Item -ItemType Directory -Force -Path ./out
            $excludeFolders = "$(ExcludePackageFolders)" -split '\s+'
            $excludePatterns = $excludeFolders | Where-Object { $_ } | ForEach-Object { "microsoft_teams_$_*" }

            Get-ChildItem -Path dist -File | Where-Object { $_.Name -ne '.gitignore' } | ForEach-Object {
              $fileName = $_.Name
              $shouldExclude = $false

              foreach ($pattern in $excludePatterns) {
                if ($fileName -like $pattern) {
                  Write-Host "Skipping $fileName (matches exclude pattern: $pattern)"
                  $shouldExclude = $true
                  break
                }
              }

              if (-not $shouldExclude) {
                Write-Host "Copying $fileName to out/"
                Copy-Item $_.FullName -Destination ./out/
              }
            }

            Write-Host "`nFiles to publish:"
            Get-ChildItem ./out
          displayName: 'Copy packages to output (excluding private packages)'
          target:
            container: host

    - stage: publish
      displayName: Publish
      dependsOn: build
      variables:
        VersionNumber: $[stageDependencies.build.build_test.outputs['versionStep.VersionNumber']]
        PyPITag: $[stageDependencies.build.build_test.outputs['versionStep.PyPITag']]
      jobs:
      # Publish to internal PyPI feed (Azure Artifacts)
      - job: publish_internal
        condition: and(succeeded(), eq('${{ parameters.publishType }}', 'Internal'))
        pool:
          name: 1ES-Teams-Windows-2022-DomoreexpGithub
          os: windows
        templateContext:
          inputs:
          - input: pipelineArtifact
            artifactName: pypi-packages
            targetPath: $(Pipeline.Workspace)/pypi-packages
        steps:
        - task: UsePythonVersion@0
          displayName: 'Use Python 3.13'
          inputs:
            versionSpec: '3.13'
          target:
            container: host

        - task: PowerShell@2
          displayName: 'Install uv'
          inputs:
            targetType: inline
            script: |
              irm https://astral.sh/uv/install.ps1 | iex
              $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
              Write-Host "##vso[task.prependpath]$env:USERPROFILE\.local\bin"
              uv --version
          target:
            container: host

        - task: PowerShell@2
          displayName: 'Publish packages to internal PyPI feed'
          inputs:
            targetType: inline
            script: |
              $feedUrl = "https://pkgs.dev.azure.com/DomoreexpGithub/Github_Pipelines/_packaging/$(internalFeedName)/pypi/upload/"
              Write-Host "Publishing packages to internal feed..."
              uv publish --publish-url $feedUrl --token $env:SYSTEM_ACCESSTOKEN $(Pipeline.Workspace)/pypi-packages/*
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          target:
            container: host

        # Promotion is one-way. Azure Artifacts has no demotion, so a version can
        # only leave a view by deleting the version or the view itself. Views are
        # for browsing and downstream consumption only; dependency resolution must
        # keep pointing at the feed itself, which is where cached upstream
        # packages live.
        - ${{ if ne(parameters.promoteView, '') }}:
          - task: PowerShell@2
            displayName: 'Promote packages to @${{ parameters.promoteView }}'
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                Add-Type -AssemblyName System.IO.Compression.FileSystem

                # The view name arrives through the environment rather than being
                # interpolated into this script, so a crafted value cannot close
                # the string and run as code in a job that holds SYSTEM_ACCESSTOKEN.
                $view = $env:PROMOTE_VIEW
                if ($view -notmatch '^[A-Za-z0-9._-]+$') { throw 'promoteView must be a feed view name matching ^[A-Za-z0-9._-]+$.' }
                $org = "$(System.CollectionUri)".TrimEnd('/').Split('/')[-1]
                $project = '$(System.TeamProject)'
                $feed = '$(internalFeedName)'
                $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }

                # Name and Version live in the RFC 822 header block. Stop at the
                # first blank line: everything after it is the long description,
                # which can contain lines that look like headers.
                function Read-DistMetadata([string]$text, [string]$source) {
                  $name = $null
                  $version = $null
                  foreach ($line in ($text -split '\r?\n')) {
                    if ($line.Trim() -eq '') { break }
                    if (-not $name -and $line -match '^Name:\s*(.+?)\s*$') { $name = $Matches[1] }
                    if (-not $version -and $line -match '^Version:\s*(.+?)\s*$') { $version = $Matches[1] }
                  }
                  if (-not $name -or -not $version) { throw "Could not read Name/Version from $source." }
                  # PEP 503 normalization. The feed stores microsoft-teams-api while
                  # the distribution files are named microsoft_teams_api-<version>.
                  return @{ Name = ($name -replace '[-_.]+', '-').ToLowerInvariant(); Version = $version }
                }

                $dists = @(Get-ChildItem -Path '$(Pipeline.Workspace)/pypi-packages' -File |
                           Where-Object { $_.Name -like '*.whl' -or $_.Name -like '*.tar.gz' })
                if ($dists.Count -eq 0) { throw 'No .whl or .tar.gz files found to promote.' }

                # One release produces both a wheel and an sdist, so collapse to
                # unique name/version pairs and promote each exactly once.
                $releases = [ordered]@{}
                foreach ($file in $dists) {
                  if ($file.Name -like '*.whl') {
                    $zip = [System.IO.Compression.ZipFile]::OpenRead($file.FullName)
                    try {
                      $entry = $zip.Entries | Where-Object { $_.FullName -match '^[^/]+\.dist-info/METADATA$' } | Select-Object -First 1
                      if ($null -eq $entry) { throw "No .dist-info/METADATA found in $($file.Name)." }
                      $reader = New-Object System.IO.StreamReader($entry.Open())
                      try { $text = $reader.ReadToEnd() } finally { $reader.Dispose() }
                    } finally { $zip.Dispose() }
                  } else {
                    # An sdist keeps PKG-INFO at the root of its single top-level
                    # directory. Match that exact member so a nested .egg-info
                    # PKG-INFO cannot be picked up instead.
                    $members = @(tar -tzf $file.FullName)
                    if ($LASTEXITCODE -ne 0) { throw "Failed to list $($file.Name)." }
                    $member = $members | Where-Object { $_ -match '^[^/]+/PKG-INFO$' } | Select-Object -First 1
                    if (-not $member) { throw "No root PKG-INFO found in $($file.Name)." }
                    $extractDir = Join-Path '$(Agent.TempDirectory)' ([System.Guid]::NewGuid().ToString())
                    New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
                    try {
                      tar -xf $file.FullName -C $extractDir $member
                      if ($LASTEXITCODE -ne 0) { throw "Failed to extract $member from $($file.Name)." }
                      $text = Get-Content (Join-Path $extractDir $member) -Raw -Encoding UTF8
                    } finally { Remove-Item $extractDir -Recurse -Force -ErrorAction SilentlyContinue }
                  }

                  $meta = Read-DistMetadata $text $file.Name
                  $releases["$($meta.Name)|$($meta.Version)"] = $meta
                }

                $failed = @()
                $promoted = 0
                foreach ($meta in $releases.Values) {
                  # The feed is shared with other products, so only promote the
                  # packages this SDK owns.
                  if (-not $meta.Name.StartsWith('microsoft-teams-', [StringComparison]::OrdinalIgnoreCase)) {
                    Write-Host "Skipping $($meta.Name) (not owned by this SDK)"
                    continue
                  }

                  # PEP 440 local version segments (2.1.0.dev9+927c1730d0) must carry
                  # an encoded '+' or the request will not match the stored version.
                  $encodedVersion = $meta.Version.Replace('+', '%2B')
                  $uri = "https://pkgs.dev.azure.com/$org/$project/_apis/packaging/feeds/$feed/pypi/packages/$($meta.Name)/versions/$encodedVersion" + '?api-version=7.2-preview.1'
                  $body = @{ views = @{ op = 'add'; path = '/views/-'; value = $view } } | ConvertTo-Json -Compress

                  Write-Host "Promoting $($meta.Name) $($meta.Version) to @$view"
                  try {
                    Invoke-RestMethod -Method Patch -Uri $uri -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
                    $promoted++
                  } catch {
                    $reason = $_.Exception.Message
                    Write-Host "##vso[task.logissue type=error]Failed to promote $($meta.Name) $($meta.Version) : $reason"
                    $failed += "$($meta.Name) $($meta.Version)"
                  }
                }

                if ($failed.Count -gt 0) {
                  $failedList = $failed -join ', '
                  throw "Promotion failed for: $failedList"
                }
                if ($promoted -eq 0) { throw 'No microsoft-teams-* packages found to promote.' }

                Write-Host "Promoted $promoted package(s) to @$view"
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              PROMOTE_VIEW: ${{ parameters.promoteView }}
            target:
              container: host

      # Publish to PyPI via ESRP
      - job: publish_public
        condition: and(succeeded(), eq('${{ parameters.publishType }}', 'Public'))
        pool:
          name: 1ES-Teams-Windows-2022-DomoreexpGithub
          os: windows
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            artifactName: pypi-packages
            targetPath: $(Pipeline.Workspace)/pypi-packages
        steps:
        - task: EsrpRelease@10
          displayName: 'Publish packages to PyPI via ESRP'
          inputs:
            connectedservicename: 'TeamsESRP-Release-PyPI'
            usemanagedidentity: true
            keyvaultname: 'esrp-teams'
            signcertname: '82a83c86-86a3-4739-8da4-fc19d60794ed'
            clientid: '82a83c86-86a3-4739-8da4-fc19d60794ed'
            intent: 'packagedistribution'
            contenttype: 'PyPI'
            contentsource: 'Folder'
            folderlocation: '$(Pipeline.Workspace)/pypi-packages'
            waitforreleasecompletion: true
            serviceendpointurl: 'https://api.esrp.microsoft.com'
            owners: $(Release.Owners)
            approvers: $(Release.Approvers)
            mainpublisher: 'ESRPRELPACMAN'
            domaintenantid: '975f013f-7f24-47e8-a7d3-abc4752bf346'
            productState: $(PyPITag)
            releasetitle: 'teams.py $(VersionNumber)'
          target:
            container: host
