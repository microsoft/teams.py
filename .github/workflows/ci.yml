# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "Build, Lint & Test"

on:
  pull_request:
    paths:
      - packages/**
      - examples/**
  push:
    branches: ["main"]
    paths:
      - packages/**
      - examples/**

# Declare default permissions as read only.
permissions: read-all

jobs:
  build-lint-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: read
      checks: write
      pull-requests: write

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    env:
      NBGV_REQUIRED: "1"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.x'

      - name: Install nbgv
        run: dotnet tool install -g nbgv

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install ${{ matrix.python-version }}
          uv python list
          uv run --python ${{ matrix.python-version }} python --version
          uv sync --python ${{ matrix.python-version }} --frozen --all-packages --group dev

      - name: Lint (Ruff)
        run: uv run --frozen --python ${{ matrix.python-version }} ruff check --no-fix .

      - name: Format (Ruff)
        run: uv run --frozen --python ${{ matrix.python-version }} ruff format --check .

      - name: Type Check (PyRight)
        run: |
          source .venv/bin/activate  # Execute script in current shell to use virtual environment
          pyright

      - name: Run Tests
        run: |
          source .venv/bin/activate
          uv run poe test-cov-ci
